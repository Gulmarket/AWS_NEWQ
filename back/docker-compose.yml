version: "3.8"

services:
  reverse-proxy:
    image: traefik:v2.2
    command:
      - "--api.insecure=true"
      - "--providers.docker"
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  postgres_gulmarket:
    image: postgres:alpine
    container_name: postgres_gulmarket
    environment:
      - POSTGRES_PASSWORD=root
      - POSTGRES_USER=admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis-gulmarket:
    image: redis:alpine
    container_name: redis-gulmarket
    ports:
      - "6379:6379"
    volumes:
      - redisgulmarket:/data

  gulmarket:
    build:
      context: ./
      target: builder
    image: gulmarket
    container_name: gulmarket
    env_file: ./.env
    ports:
      - "8080:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gulmarket.rule=Host(`api.gulmarket.com`)"
      - "traefik.http.services.gulmarket.loadbalancer.server.port=8080"
    environment:
      - ENV=dev
    volumes:
      - .:/go/src/app
      - go-modules:/go/pkg/mod
      - ~/.aws:/root/.aws:ro
    depends_on:
      - postgres_gulmarket
      - reverse-proxy
    command: ["sh", "-c", "make migrate-up && reflex -r '\\.go$$' -s -- sh -c 'go run ./'"]

volumes:
  postgres_data:
  redisgulmarket:
  go-modules:
